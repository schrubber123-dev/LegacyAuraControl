name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Windows icon
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          $bmp=[System.Drawing.Bitmap]::FromFile('assets\LegacyAura.png')
          $h=$bmp.GetHicon()
          $ico=[System.Drawing.Icon]::FromHandle($h)
          $fs=[System.IO.File]::Open('assets\LegacyAura.build.ico',[System.IO.FileMode]::Create)
          $ico.Save($fs)
          $fs.Close()
          $ico.Dispose()
          $bmp.Dispose()

      - name: Compile Legacy Aura Control
        shell: cmd
        run: |
          "%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /platform:anycpu /optimize+ /win32icon:"assets\LegacyAura.build.ico" /out:"LegacyAura.exe" /reference:System.dll /reference:System.Core.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll "src\LegacyAura.cs"

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: LegacyAuraControl
          path: LegacyAura.exe
