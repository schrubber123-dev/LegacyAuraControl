name: Bug report
description: Report a problem on already supported hardware
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: model
    attributes:
      label: Laptop model
      placeholder: ASUS ROG GU501GM
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 25H2
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Legacy Aura Control diagnostics
      description: Use "Diagnose kopieren" and paste the result here.
      render: text
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
